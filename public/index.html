<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="theme-color" content="#111111">
        <link rel="manifest" href="/manifest.webmanifest">
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
		<link rel="stylesheet" href="/style.css">
        <title>Deckboard Test Button</title>
    </head>
    <body>
        <div id="fullscreenOverlay" class="fullscreen-overlay">
			<div class="fullscreen-panel">
				<div class="fullscreen-kicker">Deckboard</div>
				<h2>Ready for fullscreen?</h2>
				<button id="fullscreenButton" class="fullscreen-button">FULLSCREEN</button>
			</div>
			</div>

            <!-- The container is populated purely from config logic -->
			<div id="deckContainer" class="deck-container"></div>

        <script src="script.js" defer></script>
    </body>
</html>
